services:
  - type: web
    name: echomap-edith
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXUS_API_KEY
        sync: false
      - key: NEXUS_BASE_URL
        value: https://nexusapi.navigatelabs.ai
      - key: NEXUS_MODEL
        value: gemini-3.1-flash-lite
      - key: PYTHON_VERSION
        value: 3.11.9

